name: l0-osi-benchmark

on:
  push:
    paths:
      - 'tools/l0_osi_stack.py'
      - 'tests/test_l0_osi_stack.py'
      - '.github/workflows/l0-benchmark.yml'
  workflow_dispatch:

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify optimized L0/OSI
        run: python -c "from tools.l0_osi_stack import verify, verify_merkle_v3; assert verify() and verify_merkle_v3(); print('0e / L0-OSI MERKLE V3 PASS')"
      - name: Benchmark legacy and binary chain
        run: python tools/l0_osi_stack.py
      - name: Benchmark Merkle block sizes
        run: python -c "import json; from tools.l0_osi_stack import benchmark_merkle_block_sizes; print(json.dumps(benchmark_merkle_block_sizes(), indent=2, sort_keys=True))"
      - name: Benchmark Merkle proof tradeoff
        run: python -c "import json; from tools.l0_osi_stack import benchmark_merkle_tradeoff; print(json.dumps(benchmark_merkle_tradeoff(), indent=2, sort_keys=True))"
