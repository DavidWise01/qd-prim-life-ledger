name: shakespeare-crystallization-benchmark

on:
  workflow_dispatch:
  push:
    paths:
      - "tools/generational_crystallization.py"
      - "tools/benchmark_shakespeare_crystallization.py"
      - "tests/test_shakespeare_benchmark_contract.py"
      - ".github/workflows/shakespeare-crystallization-benchmark.yml"

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Retest frozen crystallization binding
        run: |
          python -m pytest -q tests/test_generational_crystallization.py tests/test_shakespeare_benchmark_contract.py
          python tools/generational_crystallization.py
      - name: Benchmark Project Gutenberg Shakespeare corpus
        run: |
          python tools/benchmark_shakespeare_crystallization.py --output shakespeare_benchmark.json --min-seconds 1.0
      - name: Upload benchmark result
        uses: actions/upload-artifact@v4
        with:
          name: shakespeare-crystallization-benchmark
          path: shakespeare_benchmark.json
